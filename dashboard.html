<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 — LinkBio Lite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="dot"></span>LinkBio Lite</a>
  <div class="topbar-spacer"></div>
  <button class="icon-btn" id="darkToggle">🌙</button>
  <button class="icon-btn" id="logoutBtn">로그아웃</button>
</header>

<div class="page">
  <div id="claimView" class="card">
    <h2>내 링크 페이지 만들기</h2>
    <p style="font-size:13px; color:var(--text-1); margin:-4px 0 12px;">한 번 정하면 바꾸기 어려우니 신중하게 골라주세요.</p>
    <div class="form-col">
      <label>페이지 주소</label>
      <div class="slug-row">
        <span class="slug-prefix">linkbiolite.../page.html?u=</span>
        <input type="text" id="slugInput" placeholder="myname">
      </div>
      <button class="btn" id="claimBtn" style="align-self:flex-start;">이 주소로 만들기</button>
    </div>
  </div>

  <div id="editView" style="display:none;">
    <div class="card">
      <h2>프로필</h2>
      <p style="font-size:12.5px; color:var(--text-1); margin:-4px 0 12px;">
        공개 페이지: <a id="publicLink" target="_blank" href="#"></a>
        <button class="icon-btn" id="copyLinkBtn" style="margin-left:6px;">링크 복사</button>
      </p>
      <div class="form-col">
        <label>이름</label>
        <input type="text" id="displayName" maxlength="60">
        <label>소개</label>
        <textarea id="bio" rows="2" maxlength="200"></textarea>
      </div>
    </div>

    <div class="card">
      <h3>링크 목록</h3>
      <div id="linkRows"></div>
      <button class="icon-btn" id="addLinkBtn" style="margin-top:6px;">+ 링크 추가</button>
    </div>

    <button class="btn block" id="saveBtn">저장하기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-init.js"></script>
<script src="common.js"></script>
<script src="dashboard.js"></script>
</body>
</html>

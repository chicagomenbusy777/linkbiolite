<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkBio Lite — 나만의 링크 모음 페이지</title>
<meta name="description" content="인스타그램, 유튜브, 쇼핑몰 링크를 한 페이지에 모아 공유하세요. 무료로 30초 만에 만드는 링크인바이오 페이지입니다.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="dot"></span>LinkBio Lite</a>
  <div class="topbar-spacer"></div>
  <a href="login.html">로그인</a>
</header>

<div class="page">
  <div class="hero">
    <h1>모든 링크를<br>한 곳에</h1>
    <p>인스타그램 프로필에 딱 하나만 넣을 수 있는 링크, LinkBio Lite로 여러 개로 늘리세요. 30초면 충분합니다.</p>
    <a class="btn" href="login.html">무료로 시작하기 →</a>
  </div>

  <div class="card">
    <h2>이렇게 씁니다</h2>
    <ol style="font-size:14px; color:var(--text-1); line-height:2; padding-left:20px;">
      <li>가입하고 원하는 주소(slug)를 정합니다</li>
      <li>이름, 소개, 링크들을 추가합니다</li>
      <li>생성된 링크를 인스타/유튜브 프로필에 붙여넣습니다</li>
    </ol>
  </div>
</div>

<footer class="site-footer">LinkBio Lite는 개인이 운영하는 무료 베타 서비스입니다. 문의: chicagomenbusy@gmail.com</footer>

</body>
</html>
